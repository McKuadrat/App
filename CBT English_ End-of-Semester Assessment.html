  try{const dl=await claude.use("downloads");if(!dl)return alert("Download is not available.");
   const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
   const out=["Name,Class,Status,Correct,Essay,Final,TabExits",...rows.map(r=>[q(r.name),q(r.cls),r.status,r.c??"",r.esT?r.esT():"",r.fin&&r.status==="submitted"?r.fin():"",r.sw||0].join(","))].join("\n");
   await dl.save({filename:"cbt-english-results.csv",data:out})}catch(e){}
 };
 load();
}
</script>
